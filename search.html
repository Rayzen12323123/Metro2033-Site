<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск по сайту | Metro 2033: Reborn</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="search.js"></script>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Cormorant Infant', serif;
            color: #e6e6e6;
        }

        #searchInput {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            margin-bottom: 20px;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        #results {
            margin-top: 20px;
        }

        .result-item {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(255,255,255,0.05);
        }

        .result-item a {
            color: #76c7ff;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
        }

        .result-item a:hover {
            text-decoration: underline;
        }

        .snippet {
            margin-top: 8px;
            color: #cccccc;
            font-size: 15px;
            line-height: 1.4;
        }

        mark {
            background: #ffeb3b;
            color: #000;
            padding: 0 2px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Поиск по сайту</h1>
        <input type="text" id="searchInput" placeholder="Введите ключевое слово..." autocomplete="off">
        <div id="results"></div>
    </div>
</body>
</html>
